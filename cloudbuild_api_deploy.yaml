# Focused build-and-deploy: builds the API Docker image and deploys to Cloud Run.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: build-api
    args:
      - build
      - --platform
      - linux/amd64
      - --tag
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection:$BUILD_ID'
      - --tag
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection:latest'
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - .

  - name: 'gcr.io/cloud-builders/docker'
    id: push-api
    waitFor: [build-api]
    args:
      - push
      - '--all-tags'
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: deploy-api
    waitFor: [push-api]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_CLOUD_RUN_SERVICE}'
      - --image
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection:$BUILD_ID'
      - --region
      - '${_GCP_REGION}'
      - --service-account
      - '${_SERVING_SA}'
      - --memory
      - 2Gi
      - --cpu
      - '2'
      - --min-instances
      - '1'
      - --max-instances
      - '5'
      - --port
      - '8080'
      - --set-env-vars
      - 'ENV=dev,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_GCP_REGION},GCS_ARTIFACTS_BUCKET=${_ARTIFACTS_BUCKET},BQ_DATASET=fraud_detection,BQ_LOCATION=${_GCP_REGION},API_KEY_SECRET_NAME=fraud-api-key,SERVING_TRANSFORMER_GCS_URI=gs://${_ARTIFACTS_BUCKET}/transformers/feature_engineer.joblib,PREDICTION_LOG_BQ_TABLE=prediction_logs,DRIFT_LOG_BQ_TABLE=drift_logs,CLOUD_RUN_SERVICE_NAME=${_CLOUD_RUN_SERVICE},CLOUD_RUN_API_URL=https://${_CLOUD_RUN_SERVICE}-${_PROJECT_NUMBER}.${_GCP_REGION}.run.app,SERVING_CALIBRATED_THRESHOLD=0.2458,FEATURE_DRIFT_ALERT_POLICY=feature-drift-alert,PERFORMANCE_DRIFT_ALERT_POLICY=performance-drift-alert,ALERT_EMAIL=${_ALERT_EMAIL}'
      - --no-allow-unauthenticated
      - --quiet

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: get-url
    waitFor: [deploy-api]
    entrypoint: bash
    args:
      - -c
      - |
        SVC_URL=$$(gcloud run services describe ${_CLOUD_RUN_SERVICE} \
          --region ${_GCP_REGION} --format="value(status.url)")
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Cloud Run API URL: $$SVC_URL"
        echo "Add to .env: CLOUD_RUN_API_URL=$$SVC_URL"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

substitutions:
  _GCP_REGION: asia-south1
  _AR_REGION: asia-south1
  _AR_REPO: fraud-detection-repo
  _ARTIFACTS_BUCKET: fraud-detection-mlops-497717-fraud-artifacts
  _CLOUD_RUN_SERVICE: fraud-detection-api
  _PROJECT_NUMBER: '65768314585'
  _SERVING_SA: serving-sa@fraud-detection-mlops-497717.iam.gserviceaccount.com
  _ALERT_EMAIL: chandra.nakkalakunta@gmail.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  env:
    - 'DOCKER_BUILDKIT=1'

images:
  - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection:$BUILD_ID'
  - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection:latest'
