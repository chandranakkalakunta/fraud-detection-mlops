steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: build-streamlit
    args:
      - build
      - --platform
      - linux/amd64
      - -f
      - Dockerfile.streamlit
      - --tag
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection-streamlit:$BUILD_ID'
      - --tag
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection-streamlit:latest'
      - .

  - name: 'gcr.io/cloud-builders/docker'
    id: push-streamlit
    waitFor: [build-streamlit]
    args:
      - push
      - '--all-tags'
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection-streamlit'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: deploy-streamlit
    waitFor: [push-streamlit]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_STREAMLIT_SERVICE}'
      - --image
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection-streamlit:$BUILD_ID'
      - --region
      - '${_GCP_REGION}'
      - --service-account
      - '${_SERVING_SA}'
      - --memory
      - 2Gi
      - --cpu
      - '1'
      - --min-instances
      - '0'
      - --max-instances
      - '3'
      - --port
      - '8080'
      - --set-env-vars
      - 'ENV=dev,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_GCP_REGION},GCS_ARTIFACTS_BUCKET=${_ARTIFACTS_BUCKET},BQ_DATASET=fraud_detection,BQ_LOCATION=${_GCP_REGION},DRIFT_LOG_BQ_TABLE=drift_logs,CLOUD_RUN_API_URL=https://${_API_SERVICE}-${_PROJECT_NUMBER}.${_GCP_REGION}.run.app'
      - --allow-unauthenticated
      - --set-secrets
      - 'API_KEY=fraud-api-key:latest'
      - --quiet

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: get-streamlit-url
    waitFor: [deploy-streamlit]
    entrypoint: bash
    args:
      - -c
      - |
        SVC_URL=$$(gcloud run services describe ${_STREAMLIT_SERVICE} \
          --region ${_GCP_REGION} --format="value(status.url)")
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Streamlit Demo URL: $$SVC_URL"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

substitutions:
  _GCP_REGION: asia-south1
  _AR_REGION: asia-south1
  _AR_REPO: fraud-detection-repo
  _ARTIFACTS_BUCKET: fraud-detection-mlops-497717-fraud-artifacts
  _STREAMLIT_SERVICE: fraud-detection-streamlit
  _API_SERVICE: fraud-detection-api
  _PROJECT_NUMBER: '65768314585'
  _SERVING_SA: serving-sa@fraud-detection-mlops-497717.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection-streamlit:$BUILD_ID'
  - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/fraud-detection-streamlit:latest'
