# All values resolved from environment variables at runtime.
# No hardcoded values — see .env.example for required variables.
# Loaded via src/utils/config.py which calls os.path.expandvars on each string.

gcp:
  project_id: "${GCP_PROJECT_ID}"
  region: "${GCP_REGION}"
  zone: "${GCP_ZONE}"

storage:
  raw_bucket: "${GCS_RAW_BUCKET}"
  processed_bucket: "${GCS_PROCESSED_BUCKET}"
  artifacts_bucket: "${GCS_ARTIFACTS_BUCKET}"
  audit_bucket: "${GCS_AUDIT_BUCKET}"
  raw_data_prefix: "ieee-cis/"
  processed_prefix: "processed/"

bigquery:
  dataset: "${BQ_DATASET}"
  location: "${BQ_LOCATION}"
  kms_key_name: "${BQ_KMS_KEY_NAME}"
  tables:
    transactions_raw: "transactions_raw"
    identity_raw: "identity_raw"
    transactions_joined: "transactions_joined"

vertex:
  staging_bucket: "${VERTEX_STAGING_BUCKET}"
  pipeline_root: "${VERTEX_PIPELINE_ROOT}"
  experiment_name: "${VERTEX_EXPERIMENT_NAME}"
  featurestore_id: "${VERTEX_FEATURESTORE_ID}"
  model_display_name: "${VERTEX_MODEL_DISPLAY_NAME}"
  serving_container:
    xgboost: "us-docker.pkg.dev/vertex-ai/prediction/xgboost-cpu.1-7:latest"
    lightgbm: "us-docker.pkg.dev/vertex-ai/prediction/sklearn-cpu.1-4:latest"

service_accounts:
  training: "${TRAINING_SA}"
  serving: "${SERVING_SA}"
  pipeline: "${PIPELINE_SA}"
  monitoring: "${MONITORING_SA}"

secrets:
  kaggle: "${KAGGLE_SECRET_NAME}"
  bq_cmek: "${BQ_CMEK_SECRET_NAME}"

features:
  missing_indicator_threshold: "${FEATURE_MISSING_THRESHOLD}"
  target_encode_cols:
    - "card4"
    - "card6"
    - "P_emaildomain"
    - "R_emaildomain"
  d_normalize_group_col: "card1"
  d_normalize_cols:
    - "D1"
    - "D4"
    - "D10"
  transformer_gcs_prefix: "transformers/"
  engineered_bq_table: "transactions_engineered"

model:
  max_iter: "${MODEL_MAX_ITER}"
  random_state: "${MODEL_RANDOM_STATE}"
  test_size: "${MODEL_TEST_SIZE}"
  cv_folds: "${MODEL_CV_FOLDS}"
  val_split: "${MODEL_VAL_SPLIT}"
  primary_metric: "average_precision"
  evaluation_output: "evaluation/baseline_results.json"

  smote:
    sampling_strategy: "${SMOTE_SAMPLING_STRATEGY}"
    k_neighbors: 5
    random_state: "${MODEL_RANDOM_STATE}"

  xgboost:
    n_estimators: "${XGB_N_ESTIMATORS}"
    max_depth: "${XGB_MAX_DEPTH}"
    learning_rate: "${XGB_LEARNING_RATE}"
    scale_pos_weight: "${XGB_SCALE_POS_WEIGHT}"
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    early_stopping_rounds: "${XGB_EARLY_STOPPING_ROUNDS}"
    tree_method: "hist"
    eval_metric: "auc"
    evaluation_output: "evaluation/xgboost_results.json"

  lightgbm:
    num_leaves: "${LGB_NUM_LEAVES}"
    learning_rate: "${LGB_LEARNING_RATE}"
    n_estimators: "${LGB_N_ESTIMATORS}"
    min_child_samples: 20
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    early_stopping_rounds: "${LGB_EARLY_STOPPING_ROUNDS}"
    metric: "auc"
    evaluation_output: "evaluation/lightgbm_results.json"

explainability:
  top_n_features: "${SHAP_TOP_N_FEATURES}"
  output_gcs_prefix: "explainability/"

artifact_registry:
  repository: "${AR_REPOSITORY}"
  region: "${AR_REGION}"

data_validation:
  max_null_pct_numeric: 0.95
  max_null_pct_categorical: 0.95
  min_rows_transactions: 500000
  min_rows_identity: 100000
  expected_fraud_rate_min: 0.03
  expected_fraud_rate_max: 0.05
